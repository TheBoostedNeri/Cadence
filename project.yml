name: Cadence
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
  # XcodeGen labels Icon Composer files as generic wrappers; Xcode only compiles them into the
  # app icon when they carry its own file type.
  postGenCommand: sed -i '' 's/lastKnownFileType = wrapper.icon;/lastKnownFileType = folder.iconcomposer.icon;/' Cadence.xcodeproj/project.pbxproj

settings:
  base:
    SWIFT_VERSION: "6.0"

targets:
  Cadence:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Cadence
        excludes:
          - Resources/Info-macOS.plist
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CADENCE_BUNDLE_IDENTIFIER)
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
    info:
      path: Cadence/Resources/Info.plist
      properties:
        CFBundleDisplayName: Cadence
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        # One window only: the app has a single player, which can't be shown in two places.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # iPad supports every orientation, so the window can be resized and used in multitasking.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - audio
        NSAppleMusicUsageDescription: Cadence uses your Apple Music library to show your playlists and recently added songs, and to play Apple Music songs.
        YouTubeAPIKey: $(YOUTUBE_API_KEY)
        GoogleClientID: $(GOOGLE_CLIENT_ID)

  # The Mac app shares every source file with iOS; platform differences live in `#if os(...)`.
  # It plays YouTube only: the Apple Music library and player APIs don't exist on macOS.
  CadenceMac:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Cadence
        excludes:
          - Resources/Info.plist
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_NAME: Cadence
        PRODUCT_BUNDLE_IDENTIFIER: $(CADENCE_BUNDLE_IDENTIFIER)
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
    info:
      path: Cadence/Resources/Info-macOS.plist
      properties:
        CFBundleDisplayName: Cadence
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.music
        ITSAppUsesNonExemptEncryption: false
        YouTubeAPIKey: $(YOUTUBE_API_KEY)
        GoogleClientID: $(GOOGLE_CLIENT_ID)
